[project]
name = "polygraph-pr"
version = "1.0.0"
description = "Polygraph checks the claims a pull request makes by running the old and new code side by side and comparing what actually changed."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Yashvardhan Thanvi" }]
dependencies = [
  "openai>=1.60",
  "httpx>=0.27",
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
sandboxes = ["contree-sdk==0.3.6"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
polygraph = "polygraph.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polygraph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
